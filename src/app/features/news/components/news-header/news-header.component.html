<header class="header">
  <a class="logo" routerLink="/">MV News</a>

  <nav class="nav">
    @for (item of navItems; track item.route) {
      <a
        class="nav-link"
        routerLinkActive="active"
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ item.label }}
      </a>
    }
  </nav>
</header>
