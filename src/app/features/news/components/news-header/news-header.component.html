<header class="header">
  <a class="logo" routerLink="/">MV News</a>

  @if (isMobile()) {
    <button
      mvButton
      iconOnly
      class="sidenav-toggle"
      aria-label="Show sidenav"
      [attr.aria-expanded]="sidenavOpened()"
      (click)="openSidenav()"
    >
      <mv-icon name="list" />
    </button>
  } @else {
    <mv-news-nav-list [navItems]="navItems" />
  }

  <mv-theme-toggler class="theme-toggle" />
</header>
